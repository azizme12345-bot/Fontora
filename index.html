<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ======================================================== -->
    <!-- GOOGLE SEARCH CONSOLE OWNER VERIFICATION META TAG        -->
    <!-- Replace 'YOUR_GOOGLE_VERIFICATION_CODE_HERE' with your   -->

    <!-- ======================================================== -->
    <meta name="google-site-verification" content="e2RrqWDlKxHOPt0hT0SbW2dvhjsUgITfsuQwy6ZZhjY" />
    
    <!-- SEO Meta Tags & Canonical URL -->
    <title>Fontora - Multilingual Font Platform</title>
    <meta name="description" content="Discover, preview, and download stunning Urdu, Arabic, Hindi, English, and Roman Urdu fonts with live typography customization." />
    <meta name="keywords" content="Urdu fonts, Arabic fonts, Hindi fonts, English fonts, Roman Urdu fonts, Nastaleeq, Naskh, Fontora, free font download, multilingual typography" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://fontora-ten.vercel.app/" />

    <!-- Open Graph (OG) Meta Tags for Social Media Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fontora - Multilingual Font Platform" />
    <meta property="og:description" content="Discover, preview, and download stunning Urdu, Arabic, Hindi, English, and Roman Urdu fonts with live typography customization." />
    <meta property="og:url" content="https://fontora-ten.vercel.app/" />
    <meta property="og:site_name" content="Fontora" />
    <meta property="og:image" content="https://fontora-ten.vercel.app/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fontora - Multilingual Font Platform" />
    <meta name="twitter:description" content="Discover, preview, and download stunning Urdu, Arabic, Hindi, English, and Roman Urdu fonts with live typography customization." />

    <!-- Google Structured Data (JSON-LD Schema) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Fontora",
      "url": "https://fontora-ten.vercel.app/",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "All",
      "description": "Professional Font Discovery, Preview and Download Platform for Urdu, Arabic, Hindi, English, and Roman Urdu fonts.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
